name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c debug

      - name: Test
        run: swift test

      - name: Build release
        run: make release

      - name: Verify Calendar permission metadata
        run: bash scripts/verify-permissions.sh .build/release/apple-calendar-cli
